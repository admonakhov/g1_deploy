    transitions:
      Passive: LT + B.on_pressed
      GetUp: LT + up.on_pressed
      Walk: RB + !LB + !LT + !RT + X.on_pressed
      Run: RB + !LB + !LT + !RT + Y.on_pressed
      Teleop: RT + !LT + !RB + !LB + A.on_pressed
      TeleopArms: RT + !LT + !RB + !LB + X.on_pressed
      Idle: LB + !RB + !LT + up.on_pressed
  Idle:
    transitions:
      Passive: LT + B.on_pressed
      FixStand: LT + up.on_pressed
      Walk: RB + !LB + !LT + !RT + X.on_pressed
      Run: RB + !LB + !LT + !RT + Y.on_pressed
      Teleop: RT + !LT + !RB + !LB + A.on_pressed
      TeleopArms: RT + !LT + !RB + !LB + X.on_pressed
    policy_dir: ../policies/traj_loco
    idle_only: true
    enable_bad_orientation_passive: false
  Walk:
    transitions:
      Passive: LT + B.on_pressed
      FixStand: LT + up.on_pressed
      Run: RB + !LB + !LT + !RT + Y.on_pressed
      Teleop: RT + !LT + !RB + !LB + A.on_pressed
      TeleopArms: RT + !LT + !RB + !LB + X.on_pressed
      Idle: LB + !RB + !LT + up.on_pressed
    policy_dir: ../policies/traj_loco
    idle_only: false
    enable_bad_orientation_passive: false
    velocity_limits:
      forward: 1.5
      backward: 0.5
      lateral: 1.0
  Teleop:
    transitions:
      Passive: LT + B.on_pressed
      FixStand: LT + up.on_pressed
      Walk: RB + !LB + !LT + !RT + X.on_pressed
      Run: RB + !LB + !LT + !RT + Y.on_pressed
      TeleopArms: RT + !LT + !RB + !LB + X.on_pressed
      Idle: LB + !RB + !LT + up.on_pressed
    policy_dir: ../policies/wbc
    retarget_scope: wholebody
    failure_state: Walk
    enable_bad_orientation_passive: true
  TeleopArms:
    transitions:
      Passive: LT + B.on_pressed
      FixStand: LT + up.on_pressed
      Walk: RB + !LB + !LT + !RT + X.on_pressed
      Run: RB + !LB + !LT + !RT + Y.on_pressed
      Teleop: RT + !LT + !RB + !LB + A.on_pressed
      Idle: LB + !RB + !LT + up.on_pressed
    policy_dir: ../policies/wbc
    retarget_scope: arms
    failure_state: Walk
    enable_bad_orientation_passive: true
  Run:
    policy_dir: ../policies/traj_loco
    idle_only: false
    enable_bad_orientation_passive: false
    velocity_limits:
      forward: 4.0
      backward: 0.5
      lateral: 1.0
      planar: 4.0
    transitions:
      Passive: LT + B.on_pressed
      FixStand: LT + up.on_pressed
      Walk: RB + !LB + !LT + !RT + X.on_pressed
      Teleop: RT + !LT + !RB + !LB + A.on_pressed
      TeleopArms: RT + !LT + !RB + !LB + X.on_pressed
      Idle: LB + !RB + !LT + up.on_pressed
  GetUp:
    policy_dir: ../policies/getup
    enable_bad_orientation_passive: false
    return_state: Walk
    transitions:
      Passive: LT + B.on_pressed
      FixStand: LT + up.on_pressed
      Walk: RB + !LB + !LT + !RT + X.on_pressed
