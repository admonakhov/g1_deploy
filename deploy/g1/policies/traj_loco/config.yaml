# ai_sport FsmTrajLoco (FSM 504, from 801/802), config policies/traj_loco/fsm_config.yaml.
# Measured on the EDU bench (captures_154/probe2/504.bin) + decompiled humanoid (fsm_traj_loco.cpp) - g1_vq.ts:
#   p_obs 10 x 75 (oldest first) = gyro*0.2, projected gravity, q-default, dq*0.05, last raw action over the
#   23 joints without wrists; wrists held at 0 with their kp/kd. target = default + act.
#   cmd 163 = anchor_motion_latent(64) + 10 path blocks [dx, dy (robot yaw frame, clipped), 0,
#   rot6d(R_base^T Rz(yaw_i))] + block 0 again. The path is the reference pose (integrated from the
#   remote twist: deadzone 0.1, EMA 0.3, speed level 1 = 2.5 / 1.2 / 2.5 max, accel limits) rolled out over
#   0..0.9 s and taken relative to the estimator odometry. Replayed against the capture: path shape / heading
#   match to ~5 mrad; nets: 2026-02-27 decoder (walking), 2026-02-25 decoder (stand adjust: first 50 ticks and
#   near the end of the path), 2026-01-05 estimator (body velocity, cmd [0.5]).
