control_ui:
  notice:
    title: "Fight mode (FSM 505 PunchMode)"
    text: "This policy is a fight mode. The robot stands in a boxing guard and walks with the stick (W A S D / Q E or the left / right stick).\n\nTo fight, choose a move from the Moves list in the panel: hand strikes, hand combos, leg kicks, footwork, gestures and get down / get up. G / Shift+G steps through the moves, or use the robot's remote-controller shortcut shown when you hover a button (on a gamepad LB/RB/LT/RT = L1/R1/L2/R2).\n\nAfter a fall the robot stays down until you pick Get up."
  # Action names from the motion each clip produces (simulated with refs/vq2/ref505.py: which hand / foot moves,
  # reach, foot height, turn); the combo is the robot remote-controller shortcut (single keys = double press).
  actions:
    - group: "Hand strikes"
      items:
        - {combo: "R1+Up", label: "Left jab"}
        - {combo: "R1+Left", label: "Left hook"}
        - {combo: "R1+Right", label: "Right hook"}
        - {combo: "R1+Down", label: "Right power punch"}
        - {combo: "R1+Select", label: "Punch flurry"}
    - group: "Hand combos"
      items:
        - {combo: "L1+Up", label: "One-two combo"}
        - {combo: "L1+Left", label: "Left-lead combo"}
        - {combo: "L1+Right", label: "Right-lead combo"}
        - {combo: "L1+Down", label: "Right-heavy combo"}
    - group: "Leg kicks"
      items:
        - {combo: "R2+Up", label: "Left front kick"}
        - {combo: "R2+Down", label: "Right roundhouse kick"}
        - {combo: "R2+Left", label: "Left spinning kick"}
        - {combo: "R2+Right", label: "Right spinning kick"}
    - group: "Footwork"
      items:
        - {combo: "Up", label: "Step in & pivot"}
        - {combo: "Down", label: "Step back"}
        - {combo: "Left", label: "Side-step left"}
        - {combo: "Right", label: "Side-step right"}
    - group: "Gestures"
      items:
        - {combo: "A", label: "Left arm sweep"}
        - {combo: "B", label: "Left arm wave"}
        - {combo: "X", label: "Guard bounce"}
        - {combo: "Y", label: "Guard shuffle"}
    - group: "Ground"
      items:
        - {combo: "L2+Down", label: "Get down"}
  trigger_keys: ["R1+Down", "R1+Left", "R1+Right", "R1+Select", "R1+Up", "R2+Down", "R2+Left", "R2+Right", "R2+Up", "L1+Down", "L1+Left", "L1+Right", "L1+Up", "L2+Down", "A", "B", "Down", "Left", "Right", "Up", "X", "Y"]
