# ai_sport FsmPunchMode (FSM 505, G1 EDU 29-DOF; entered 4 -> 802 -> SetFsmId 505; the scheduler needs the EDU
# /unitree/robot/basic/ver and robot_type "18", seeded by the bring-up - no binary patch). Config
# policies/punch_mode/fsm_config.yaml. Decoded from the humanoid binary (fsm_punch_mode.cpp) and verified on the bench
# MNN captures (captures_154/probe6/505, 505full, 505b) - details in src/core/drivers/g1_punch.ts:
#   p_obs 10 x 75 (oldest first) = gyro*0.2, projected gravity, q-default, dq*0.05, last action over the 23 joints
#   without wrists; wrists held at 0. target = default + clip(act, +-20); kp/kd = config.
#   walking: g1_punch_walk_12500 decoder, cmd 163 = anchor_motion_latent + 10 path blocks + block 0 (block = path - odom
#   in the yaw frame, 0, rot6d(Rz(yaw_i) R^T)); twist speed level 1 (0.8 / 0.6 / 2.0 max, accel 1.2 / 1 / 4),
#   estimator odometry (cmd [0.5]).
#   moves: remote combo -> take CSV rows round(t_start*50)..round(t_end*50), cmd 73 = [latent(64) raw, 0,0,0
#   (mask_root_pos_error), rot6d(q_off q_ref q_robot^-1)] on punch_29dof_28000 (punches, entry clip) or
#   punch_29dof_add_getup_46000 (L2+Down get down, L2+Up get up). Fall protection: projected gravity z > -0.5 -> 2 s
#   blend to front/back_down_jpos with the action zeroed, until L2+Up. On the robot bare keys need a double press.
# Web: the named action buttons in the panel (control_ui.actions), G / Shift+G, or the pad combo (LB/RB/LT/RT = L1/R1/L2/R2).
