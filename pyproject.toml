[project]
name = "fast-teleop"
version = "0.1.0"
description = "Video stream and human pose visualization with Easy-ViTPose"
requires-python = ">=3.11,<3.12"
dependencies = [
    "easy-vitpose",
    "ffmpeg-python>=0.2,<0.3",
    "filterpy==1.4.5",
    "matplotlib>=3.8,<3.11",
    "mediapipe>=0.10.30,<0.11",
    "mink>=0.0.13,<0.1",
    "mujoco>=3.3,<4",
    "numpy==1.26.4",
    "opencv-python>=4.8,<4.12",
    "scikit-image>=0.22,<0.26",
    "scipy>=1.11,<1.16",
    "qpsolvers[daqp]>=4.3,<5",
    "rich>=13,<15",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "ultralytics==8.3.107",
]

[project.optional-dependencies]
motion = ["aiohttp>=3.11,<4", "vosk>=0.3.45,<0.4"]

[tool.uv.sources]
easy-vitpose = { path = "vitpose", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
cache-dir = ".cache/uv"
